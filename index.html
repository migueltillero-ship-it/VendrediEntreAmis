<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendredi entre amis | Miguel Tillero</title>
    <!-- Importación de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS de Choque Inyectado: Diseño Rive Gauche garantizado -->
    <style>
        :root {
            --vea-encre: #1F355E;
            --vea-vert: #0B3327;
            --vea-creme: #FAF6EE;
            --vea-papier: #FFFDF8;
            --vea-or: #C8A44D;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            background-color: var(--vea-creme);
            color: var(--vea-encre);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .hero-section {
            text-align: center;
            padding: 5rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .kicker {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--vea-or);
            margin-bottom: 1rem;
            display: block;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 5vw, 4.5rem);
            color: var(--vea-vert);
            font-weight: 600;
            margin: 0 0 1rem 0;
            line-height: 1.1;
        }

        .manifesto {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.5rem;
            color: var(--vea-encre);
            margin-bottom: 3rem;
        }

        /* Contenedor estético del video/imagen */
        .media-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 4rem auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(11, 51, 39, 0.08);
            border: 1px solid var(--vea-or);
            background: var(--vea-papier);
            padding: 0.5rem;
        }

        .media-container img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--vea-encre);
            color: var(--vea-papier);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .cta-button:hover {
            background-color: var(--vea-vert);
        }
    </style>
</head>
<body>

    <main class="hero-section">
        <span class="kicker">Un espace indépendant par Miguel Tillero</span>
        <h1>Vendredi entre amis</h1>
        <p class="manifesto">« Chaque vendredi, une conversation. Chaque semaine, une progression. »</p>

        <!-- El póster que descargamos se mostrará aquí de forma elegante -->
        <div class="media-container">
            <img src="club/assets/images/poster-bienvenue.jpg" alt="Atmosphère Vendredi entre amis">
        </div>

        <a href="#inscription" class="cta-button">Rejoindre le cercle</a>
    </main>

</body>
</html>
