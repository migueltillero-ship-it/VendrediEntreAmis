<header id="topbar"><div id="topbar-mount"></div></header>

<main class="container">
  <p class="eyebrow">Un petit défi, 5 minutes maximum</p>
  <h1>Le Défi de la Semaine</h1>
  <p class="muted" style="max-width:60ch;margin:.5rem 0 1.5rem;">Le défi de cette semaine, par niveau — et tous les défis des semaines précédentes, si tu veux les reprendre.</p>

  <h3>Cette semaine</h3>
  <div id="reto-a1a2" class="reto-card">
    <label>
      <input type="checkbox" id="reto-check-a1a2">

    </label>
  </div>
  <div id="reto-b1b2" class="reto-card">

      <input type="checkbox" id="reto-check-b1b2">
      <span><strong>B1–B2 :</strong> <span id="reto-b1b2-texto"></span></span>
    </label>
  </div>

  <h3 style="margin-top:2rem;">Défis précédents</h3>
  <div class="toolbar">
    <div class="pill-filters" id="defis-filtros">
      <button class="active" data-nivel="todos">Tous niveaux</button>
      <button data-nivel="a1a2">A1–A2</button>
      <button data-nivel="b1b2">B1–B2</button>
    </div>
  </div>
  <div class="entry-list" id="defis-list"></div>
